services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: postgres
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  bot-migrate:
    build:
      context: .
      dockerfile: cmd/bot/migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/bot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scrapper-migrate:
    build:
      context: .
      dockerfile: cmd/scrapper/migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/scrapper?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: cmd/bot/Dockerfile
    env_file: .env.bot
    environment:
      APP_DATABASE_URL: postgres://app:app@postgres:5432/bot?sslmode=disable
      APP_SCRAPPER_HTTP_URL: http://scrapper:8080
      APP_SCRAPPER_GRPC_ADDR: scrapper:50051
    ports:
      - "8090:8090"
      - "50051:50051"
    depends_on:
      bot-migrate:
        condition: service_completed_successfully

  scrapper:
    build:
      context: .
      dockerfile: cmd/scrapper/Dockerfile
    env_file: .env.scrapper
    environment:
      APP_DATABASE_URL: postgres://app:app@postgres:5432/scrapper?sslmode=disable
      APP_BOT_HTTP_URL: http://bot:8090
      APP_BOT_GRPC_ADDR: bot:50051
    ports:
      - "8080:8080"
      - "50052:50052"
    depends_on:
      scrapper-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: